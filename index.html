<style>
:root{--bg:#f3efe6;--fg:#231f1a;--card:#fffdf8;--ac:#b4501c;--mut:#7a7063;--line:#d9cfbd;--tile:#e9e0cd;--hi:#f2c36b;--bad:#c23b3b;--ok:#2f8f4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141a;--fg:#eee6d8;--card:#241f28;--ac:#f08a4b;--mut:#9a8f9f;--line:#3a3340;--tile:#2d2733;--hi:#7a5a1f;--bad:#e06666;--ok:#58c07a;color-scheme:dark}}

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 8px}h2{font-size:15px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
button,.t{touch-action:manipulation}button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:2px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.t{aspect-ratio:1;background:var(--tile);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1;position:relative}
.t{background:var(--g1);border-radius:3px}.t.b2{background:var(--g2)}.t small{font-size:10px;color:var(--mut)}.t.w{}.t.mv{outline:2px dashed var(--ok)}.t.tg{background:var(--hi);outline:2px solid var(--bad)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%}
.log{height:150px;overflow:auto;font-size:13px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;align-items:center}.sp{flex:1}.mut{color:var(--mut);font-size:13px}

:root{--g1:#86cf72;--g2:#7ac566}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#3f6b3a;--g2:#386234}}
:root[data-theme="dark"]{--g1:#3f6b3a;--g2:#386234}
.px{width:88%;height:88%;image-rendering:pixelated}.px.bg{width:104%;height:104%;z-index:1}.px.mn{width:58%;height:58%}
.hb{position:absolute;left:12%;right:12%;bottom:2px;height:4px;background:#222;border-radius:2px;overflow:hidden}.hb i{display:block;height:100%}
.wrap{position:relative}.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}.fx>*{position:absolute;transform:translate(-50%,-50%)}
.fp{width:calc(80%/var(--w));aspect-ratio:1;image-rendering:pixelated;animation:fly .34s linear forwards}
.fi{width:calc(110%/var(--w));aspect-ratio:1;image-rendering:pixelated;animation:pop .42s ease-out forwards}
.fg{width:calc(86%/var(--w));aspect-ratio:1;image-rendering:pixelated;animation:fade .7s ease-out forwards}
.fd{width:calc(24%/var(--w));aspect-ratio:1;border-radius:50%;background:var(--c);animation:fly .4s ease-out forwards}
.fs{height:calc(30%/var(--w));transform:translate(0,-50%) rotate(var(--r));transform-origin:0 50%;background:linear-gradient(90deg,transparent,var(--c));animation:fade .45s ease-out forwards}
@keyframes fly{from{left:var(--x0);top:var(--y0)}to{left:var(--x1);top:var(--y1)}}
@keyframes pop{0%{opacity:1;scale:.3}100%{opacity:0;scale:1.7}}
@keyframes fade{from{opacity:.65}to{opacity:0}}

<script>

const SPR={

sniper:{pal:{b:'#9b6a3a',w:'#f2e2c2',y:'#f2b630',k:'#2a1a0a'},rows:['...kkkkkk...','..kbbbbbbk..','.kbwkbbkwbk.','.kbbbyybbbk.','..kbbbyybk..','...kbbbbk...','..kbbbbbbk..','.kbwbbbbwbk.','.kbwbbbbwbk.','..kbbbbbbk..','...kyk.kyk..','...kk...kk..']},

warden:{pal:{s:'#8d8d99',o:'#ffa500',b:'#5a5a66',k:'#1e1e24'},rows:['...kkkkkk...','..kssssssk..','.ksoosssoosk','.kssssssssk.','..kssssssk..','kksssssssskk','ksssbbbbsssk','ksssbbbbsssk','kksssssssskk','.kssssssssk.','.kssk..kssk.','.kkkk..kkkk.']},
anvil:{pal:{g:'#9aa0b4',k:'#2a2d3a',y:'#ffd84d',o:'#ff7a1a'},rows:['.....y......','....yoy.....','kkkkkkkkkkk.','kggggggggggk','.kggggggggk.','..kkggggkk..','....kggk....','....kggk....','...kggggk...','..kggggggk..','.kkkkkkkkkk.','............']},
rock:{pal:{g:'#8a8a94',l:'#b9b9c4',k:'#33333b'},rows:['............','............','...kkkkk....','..kggllgk...','.kgglgggk...','.kgggggggk..','kggkggggggk.','kgggggkgggk.','kggggggggggk','.kkgggggkkk.','...kkkkkk...','............']},
human:{pal:{h:'#6b4423',s:'#f2c9a0',c:'#3b6fd4',d:'#e8c14a',b:'#3a2a1a',k:'#222222'},rows:null},
goblin:{pal:{h:'#2f6b2a',s:'#7ac04f',c:'#8b5a2b',d:'#c9a227',b:'#3a2a1a',k:'#222222'},rows:null},

orc:{pal:{h:'#222222',s:'#5c8f3a',c:'#9b2f2f',d:'#c9a227',b:'#2a2a2a',k:'#222222'},rows:null}};
const PL=['...hhhhhh...','..hhhhhhhh..','..hsskssksh.','..hssssssh..','...ssssss...','..cccccccc..','.cccccccccc.','.sccccccccs.','.sccccccccs.','..cccddccc..','..cc....cc..','..bb....bb..'];
['human','goblin','elf','orc'].forEach(k=>SPR[k].rows=PL);
const SPC={};
function spr(key){if(!SPC[key]){const d=SPR[key];let r='';d.rows.forEach((row,y)=>{for(let x=0;x<row.length;x++){const c=row[x];if(c!=='.')r+=`<rect x='${x}' y='${y}' width='1' height='1' fill='${d.pal[c]}'/>`}});SPC[key]='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' shape-rendering='crispEdges'>${r}</svg>`)}return SPC[key]}
const SPAL=['#ffffff','#ff5a36','#ffb02e','#ffe14d','#4cd964','#35c4ff','#a35bff','#222222'];
const blank=()=>Array.from({length:8},()=>Array(8).fill(0));
const GC={};
function gridUrl(g){const k=g.map(r=>r.join('')).join('/');if(!GC[k]){let r='';g.forEach((row,y)=>row.forEach((v,x)=>{if(v)r+=`<rect x='${x}' y='${y}' width='1' height='1' fill='${SPAL[v-1]}'/>`}));GC[k]='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'>${r}</svg>`)}return GC[k]}
const filled=g=>g.some(r=>r.some(v=>v)),visReady=a=>!!(a.vis&&a.vis.fr.every(filled));
function preset(el,st){const cm={fire:[3,2],ice:[1,6],shock:[4,3],poison:[5,7]}[el]||[1,6],g=blank();for(let y=0;y<8;y++)for(let x=0;x<8;x++){const d=Math.hypot(x-3.5,y-3.5);let v=0;if(st===0){if(d<1.5)v=cm[0]}else if(st===1){if(d<1.3)v=cm[0];else if(d<2.4)v=cm[1]}else{if(d<1.2)v=cm[0];else if(d>2.2&&d<3.5&&(x+y)%2==0)v=cm[1]}g[y][x]=v}return g}
function visUrls(a){if(a.vis&&a.vis.on&&visReady(a))return a.vis.fr.map(gridUrl);const el=a.el?a.el.k:null;return[0,1,2].map(i=>gridUrl(preset(el,i)))}
const cx=x=>((x+.5)/W*100)+'%',cy=y=>((y+.5)/H*100)+'%',DT=['streak','afterimage','smoke','spark','blink'];
function fxSpell(a,e){const P={x:S.px,y:S.py},u=visUrls(a);S.pfx=S.pfx||[];
if(!e){S.pfx.push({k:'imp',at:P,u:u[2]});return}
const T={x:e.x,y:e.y};
if(a.r>1){S.pfx.push({k:'imp',at:P,u:u[0]},{k:'proj',a:P,b:T,u:u[1]},{k:'imp',at:T,u:u[2],d:.3})}else S.pfx.push({k:'imp',at:T,u:u[2]})}
function fxDash(a,f,t){const pr=a.dt||'streak',rest=DT.filter(x=>x!==pr).sort(()=>Math.random()-.5).slice(0,2);S.pfx=S.pfx||[];[pr,...rest].forEach(k=>S.pfx.push({k:'d_'+k,a:f,b:t}))}
function fxHTML(L){return (L||[]).map(f=>{const dl=f.d?`animation-delay:${f.d}s;`:'';
if(f.k==='imp')return `<img class="fi" style="left:${cx(f.at.x)};top:${cy(f.at.y)};${dl}" src="${f.u}">`;
if(f.k==='proj')return `<img class="fp" style="--x0:${cx(f.a.x)};--y0:${cy(f.a.y)};--x1:${cx(f.b.x)};--y1:${cy(f.b.y)};left:${cx(f.a.x)};top:${cy(f.a.y)}" src="${f.u}">`;
if(f.k==='ghost')return `<img class="fg" style="left:${cx(f.at.x)};top:${cy(f.at.y)}" src="${spr(f.s)}">`;
if(f.k==='slash')return `<div class="fi" style="left:${cx(f.at.x)};top:${cy(f.at.y)};${dl}background:radial-gradient(circle,#fff 0,${f.c||'#e0483e'} 40%,transparent 70%);border-radius:50%"></div>`;
if(f.k==='d_streak'){const dx=f.b.x-f.a.x,dy=f.b.y-f.a.y,L=Math.hypot(dx,dy);return `<div class="fs" style="left:${cx(f.a.x)};top:${cy(f.a.y)};width:${L*100/W}%;--r:${Math.atan2(dy,dx)}rad;--c:#fff"></div>`}
if(f.k==='d_afterimage')return [.25,.5,.75].map((t,i)=>`<img class="fg" style="left:${cx(f.a.x+(f.b.x-f.a.x)*t)};top:${cy(f.a.y+(f.b.y-f.a.y)*t)};animation-delay:${i*.05}s;opacity:0" src="${spr(S.race)}">`).join('');
if(f.k==='d_smoke')return [0,1,2].map(i=>`<div class="fi" style="left:${cx(f.a.x)};top:${cy(f.a.y)};animation-delay:${i*.07}s;background:radial-gradient(circle,#ffffffcc 0,#ffffff00 70%);border-radius:50%"></div>`).join('');

return ''}).join('')}
function snap(){return S.en.map(e=>({x:e.x,y:e.y,t:e.t,boss:e.boss,mini:e.mini,hp:e.hp,mhp:e.mhp,cw:e.cw}))}
function rec(e,b,l){const nl=LQ.slice(l).join('|'),fx=[],P={x:S.px,y:S.py},k=e.boss||e.t;
if(e.x!=b.x||e.y!=b.y)fx.push({k:'ghost',at:b,s:k});
if(/hits you|CHARGES|parry|cannot touch/.test(nl))fx.push(e.r>1?{k:'proj',a:{x:e.x,y:e.y},b:P,u:gridUrl(preset('fire',1))}:{k:'slash',at:P});
else if(/swings at the spot/.test(nl))fx.push({k:'slash',at:S.pre||P,c:'#ffb02e'});

function play(){const fr=S.fr;S.fr=null;if(!fr||fr.length<2){S.view=null;draw();return}
const has=fr[0].fx&&fr[0].fx.length,n=Math.max(1,fr.length-2),step=Math.max(110,Math.min(300,Math.round(1000/n)));
if(fr.length===2&&!has){S.view=null;draw();return}
S.anim=true;let i=0;const go=()=>{if(i>=fr.length-1){S.view=null;S.anim=false;draw();return}S.view=fr[i];draw();const d=i===0?(has?380:0):step;i++;setTimeout(go,d)};go()}
function tileHTML(x,y,e,me,gh){if(isW(x,y))return `<img class="px" src="${spr('rock')}">`;

function paint(x,y){const a=S.own[lk],v=lkV(a),g=v.fr[lkf];g[y][x]=g[y][x]===lkc?0:lkc;if(!visReady(a))v.on=false;draw()}
function lkClear(){const a=S.own[lk],v=lkV(a);v.fr[lkf]=blank();v.on=false;draw()}

function lookCard(){if(!S.own)return '';const NM=['Cast','Travel','Impact'];
return `<div class="card"><h2>🎨 Spell and dash looks</h2><div class="mut">Spells take their look from their element. Or draw your own 8x8 pixel art for all three states (Cast, Travel, Impact), then switch Custom on. A dash plays its chosen transition plus two random ones.</div>${S.own.map((a,i)=>{let ed='';

else{const v=lkV(a),g=v.fr[lkf];ed=`<div class="row">${NM.map((n,f)=>`<button class="${lkf===f?'on':''}" onclick="lkF(${f})">${n}${filled(v.fr[f])?' ✓':''}</button>`).join('')}</div>
<div style="display:grid;grid-template-columns:repeat(8,28px);gap:1px;margin:6px 0;background:var(--line);width:max-content">${g.map((row,y)=>row.map((c,x)=>`<div onclick="paint(${x},${y})" style="width:28px;height:28px;background:${c?SPAL[c-1]:'repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0 0/10px 10px'}"></div>`).join('')).join('')}</div>
